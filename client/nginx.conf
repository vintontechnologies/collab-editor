# Upgrade WebSocket connections, leave normal requests alone
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# If a proxy in front (Cloudflare, Caddy) already handled https, keep that information
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Docker's DNS returns every backend container, so scaling the backend spreads the load
upstream backend {
    server backend:8000;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/   { proxy_pass http://backend; }
    location /admin/ { proxy_pass http://backend; }
    location /static/ {
        alias /static/;   # collected Django static files (shared volume)
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # keep long-lived WebSockets open
    }

    # Everything else is the React app; unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
