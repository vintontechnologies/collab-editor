# Render Blueprint: describes the free web service, database and Redis in one file
services:
  - type: web
    name: collab-editor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: collab-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: collab-redis
          property: connectionString

  - type: keyvalue
    name: collab-redis
    plan: free
    ipAllowList: []   # reachable only from my own services
    maxmemoryPolicy: allkeys-lru

databases:
  - name: collab-db
    databaseName: collab
    user: collab
    plan: free
